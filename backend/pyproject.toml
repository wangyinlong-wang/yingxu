[project]
name = "yingxu-publisher"
version = "0.1.0"
description = "Local content production, review and assisted publication"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.118,<1", "uvicorn>=0.37,<1", "sqlalchemy>=2.0.43,<2.1",
  "alembic>=1.16,<2", "httpx[socks]>=0.28,<0.29", "pydantic-settings>=2.10,<3",
  "feedparser>=6.0.11,<7", "pillow>=11,<13", "beautifulsoup4>=4.13,<5",
  "python-multipart>=0.0.20,<1", "uiautomator2>=3.4,<4",
]

[project.urls]
Repository = "https://github.com/wangyinlong-wang/yingxu"
Issues = "https://github.com/wangyinlong-wang/yingxu/issues"
Changelog = "https://github.com/wangyinlong-wang/yingxu/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-mock>=3.14,<4", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110
